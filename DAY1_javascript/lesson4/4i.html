<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shopping website</title>
    <style>
        .add{
            background-color: yellow;
            color:black;
            border-color:black;
            border-width: 2px;
            border-style: solid;
        }
        .buy{
             background-color:orange;
            color:black;
            border-color:black;
            border-width: 2px;
            border-style: solid;
        }
    </style>
</head>
<body>
    <p>Adults Plain Cotton T-shirt</p>
    <p>Price:$7.99</p>
    <button class="add" onclick="showPopup()" >Add to cart</button>
    <button class="buy" onclick="showbuy()">Buy now</button>
    <script>
        function showPopup(){
            alert("Added");
        }
        function showbuy(){
            alert("Purchased");
            console.log("Loading...");
        }
    </script>
</body>
</html>
