<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean</title>
</head>
<body>
    <script>
        const hours=10;
        const name="Kirti";
        if  (hours >=6 && hours <=12){
            console.log(`Good morning ${name}!`);
        }
        else if(hours >=13 && hours <=17){
            console.log(`Good afternoon ${name}!`);
        }
        else{
            console.log(`Good night ${name}!`);
        }
    </script>
</body>
</html>
