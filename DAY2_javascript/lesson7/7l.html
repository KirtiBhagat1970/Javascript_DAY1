<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Show Quantity</button>

    <button onclick="
      updatecardquantity(1);
    ">Add to Cart</button>

    <button onclick="
            updatecardquantity(2);
    ">+2</button>

    <button onclick="
      updatecardquantity(3);
    ">+3</button>

    <button onclick="
      updatecardquantity(4);
    ">+4</button>

    <button onclick="
      updatecardquantity(5);
    ">+5</button>

    
    <button onclick="
      updatecardquantity(-1);
    ">Remove from cart</button>

    <button onclick="
      updatecardquantity(-2);
    ">-2</button>

    <button onclick="
      updatecardquantity(-3);
    ">-3</button>
    

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">Reset Cart</button>

    <script>
      let cartQuantity = 0;

      function updatecardquantity(add){
        if (cartQuantity+add > 10){
            console.log("the cart is full");
        }
        else if(cartQuantity+add < 0){
            console.log("not enough items in the cart");

        }
        else {
            cartQuantity+=add;
            console.log(`cartQuantity:${cartQuantity}`)
        }
      }
    </script>
  </body>
</html>
