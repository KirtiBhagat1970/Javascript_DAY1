<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <button onclick="
      playgame('heads');
    ">heads</button>

    <button onclick="
      playgame('tails');
    ">tails</button>

    <script>
      function playgame(guess) {
        const random = Math.random();
        const result = random < 0.5 ? 'heads' : 'tails';

        console.log(guess === result ? 'You win!' : 'You lose!');
      }
    </script>
  </body>
</html>
