<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <button onclick="playgame('heads')">
       heads
    </button>
    <button onclick="playgame('tails')">
       tails
    </button>

    <script>
        let score={
            wins:0,
            losses:0
        }

        function playgame(guess){
            const random=Math.random();
            const result=(random < 0.5 ? 'heads':'tails');

            if(guess==result){
                score.wins++;
            }
            else{
                score.losses++;
            }
            console.log(score);


        }


    </script>
</body>
</html>
