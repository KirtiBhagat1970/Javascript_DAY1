<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .toggle-btn{
            background-color: black;
            color:white;
            border: none;
            border-radius: 5px;
            padding:10px 15px 10px 15px;
            font-weight: bold;
            cursor:pointer;
        }
        .is-toggled{
            background-color: black;
            color:white;
        }
    </style>
</head>
<body>
    <button class="toggle-btn js-button" 
    onclick="const button=document.querySelector('.js-button');
    if(!button.classList.contains('is-toggled'))
    {
        button.classList.add('.is-toggled');
    }
    else{
        button.classList.remove('.is-toggled');
    }">Gaming</button>
</body>
</html>
