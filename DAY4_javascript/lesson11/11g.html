<!DOCTYPE HTML>
<html>
    <head>
        <title>Array</title>
    </head>
    <body>
        <script>
            array=[1,2,3];
            result=[];
            for(let i=0;i<=array.length-1;i++){
                result.push(array[i]+1);

            }
            console.log(result);
        </script>
    </body>
</html>
