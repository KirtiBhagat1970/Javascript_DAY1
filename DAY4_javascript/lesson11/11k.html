<!DOCTYPE HTML>
<html>
    <head>
        <title>Array</title>
    </head>
    <body>
        <script>
            function countPositive(nums){
                count_positive=0;
                for(let i=0;i<=nums.length-1;i++){
                    while (nums[i]>0){
                        count_positive+=1;
                    }
                    return count_positive;
                }
            }
            console.log(countPositive([1,-3,5]));
            console.log(countPositive([-2,3,-5,7,10]));
        </script>
    </body>
</html>
