<!DOCTYPE HTML>
<html>
    <head>
        <title>Advanced function</title>
    </head>
    <body>
        <script>
            const add=function(){
                console.log(2+3);

            }
            add();
            function runTwice(fun){
                fun();
                fun();
            }
            // add();
            runTwice(function(){
                console.log('12b');
            });
            runTwice(add);
        </script>
    </body>
</html>
