<!DOCTYPE HTML>
<html>
    <head>
        <title>App</title>
    </head>
    <body>
        <button  onclick="
        message++
        ">
            Add
        </button >
        <button  onclick="
        if(message>0){
            message--;
        }
        if (message===0){
            stopnotification();
        }">
            Remove
        </button>
        <script>
            let message=2;
            let intervalid;
            let isdisplaynotification;
            displaynotification();

            function displaynotification(){
                if (isdisplaynotification){
                    return;
                }

            }

            isdisplaynotification=true;
            setInterval(function(){
                
                if (document.title==='App'){
                    document.title=`(${message}) New Messages`;
                }
                else{
                    document.title='App';
                }
            },1000);

            function stopnotification(){
                isdisplaynotification=false;
                clearInterval(intervalid);
                document.title='App';
            }
        </script>
    </body>
</html>
