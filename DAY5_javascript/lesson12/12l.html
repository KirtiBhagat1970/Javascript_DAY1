<!DOCTYPE HTML>
<html>
    <head>
        <title>Advanced function</title>
    </head>
    <body>
        <script>
           function countPositive(nums){
            let positivenums=0;
            nums.forEach((num)=>{
                if (num > 0){
                    positivenums++;
                }
            });
            return positivenums;
           }
           console.log(countPositive([1,-3,5]));
           console.log(countPositive([-2,3,-5,7,10]));
        </script>
    </body>
</html>
