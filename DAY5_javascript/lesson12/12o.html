<!DOCTYPE HTML>
<html>
    <head>
        <title>Advanced function</title>
    </head>
    <body>
        <script>
           function removeEgg(foods){
            let eggremoved=0;
            return foods.filter((food) => {
                if (food === 'egg' && eggremover <2)
            {
                eggremoved++;
                return false;
            }
            else{
                return true;
            }

            });
           }
           console.log(removeEgg(['egg','apple','egg','egg','ham']));
           
        </script>
    </body>
</html>
